# PCR V21 P1 ? SOURCE-ONLY PR CI. Not an operative PC8 release or deployment grant.
name: xcomp-d1d2-source-integrity
on:
  pull_request:
    branches:
      - platform/neutral-vnext-vn2-pc0-discovery-successor
permissions:
  contents: read
jobs:
  xcomp-d1d2-integration-regression:
    name: xcomp-d1d2-integration-regression
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Check real source PR and allowed ancestry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:GITHUB_EVENT_NAME -cne 'pull_request' -or
              $env:GITHUB_REPOSITORY -cne 'joelkamda/xbos') { throw 'NOT_AUTHENTIC_SOURCE_PR' }
          $e = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $p = $e.pull_request
          $base = 'platform/neutral-vnext-vn2-pc0-discovery-successor'
          if ($null -eq $p -or $e.repository.full_name -cne 'joelkamda/xbos' -or
              $p.base.ref -cne $base -or $env:GITHUB_BASE_REF -cne $base -or
              $p.head.repo.full_name -cne 'joelkamda/xbos' -or
              $p.head.ref -cne $env:GITHUB_HEAD_REF) { throw 'UNTRUSTED_PR_REPOSITORY_OR_REF' }
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or
              $env:GITHUB_REF -cne "refs/pull/$($e.number)/merge") { throw 'PR_MERGE_CHECKOUT_DRIFT' }
          git merge-base --is-ancestor $p.head.sha HEAD
          if ($LASTEXITCODE -ne 0) { throw 'PR_HEAD_NOT_IN_MERGE_CHECKOUT' }
          git merge-base --is-ancestor $p.base.sha HEAD
          if ($LASTEXITCODE -ne 0) { throw 'PR_BASE_NOT_IN_MERGE_CHECKOUT' }
          $allowed = @('ci/xcomp-d1d2-source-checks-20261109',
                       'ci/xcomp-p3-wrapper-admission-20261111',
                       'platform/xcomp-d1d2-integrated-source-20261109',
                       'review/xcomp-be-current-base-wrapper-20261111',
                       'review/xcomp-pc0-v2-w-source-20261111',
                       'review/xcomp-pc8-local-first-v2-source-20261111')
          if ($p.head.ref -cnotin $allowed) { throw 'UNADMITTED_D1D2_PR_HEAD' }
          $originalSource = '9c867c224f86ca245d683ecc9fdc6b4faec7c8c5'
          if ($p.head.ref -ceq 'platform/xcomp-d1d2-integrated-source-20261109' -and
              $p.head.sha -cne $originalSource) {
            throw 'INTEGRATION_COMMIT_IDENTITY_CHANGED'
          }
          if ($p.head.ref -ceq 'review/xcomp-pc0-v2-w-source-20261111') {
            # W v2 review demands the exact two-parent source admission wrapper.
            $wSource = 'd5ffbc3c253cbd0530bd15cac1e594a0447bf8e5'
            $parents = @((git rev-list --parents -n 1 $p.head.sha) -split ' ')
            if ($parents.Count -ne 3 -or $parents[0] -cne $p.head.sha -or
                $parents[1] -cne $p.base.sha) {
              throw 'W_V2_REVIEW_WRAPPER_PARENT_PROVENANCE_DENIED'
            }
            git merge-base --is-ancestor $wSource $parents[2]
            if ($LASTEXITCODE -ne 0) { throw 'W_V2_CI_SOURCE_NOT_DESCENDED_FROM_QUALIFIED_W' }
            $allowedWorkflowDelta = @(
              '.github/workflows/xcomp-d1d2-source-integrity.yml',
              '.github/workflows/xcomp-pc0-v2-restaurant-admission.yml'
            )
            $changedWorkflowDelta = @((git diff --name-only $wSource $parents[2]))
            if ($LASTEXITCODE -ne 0 -or $changedWorkflowDelta.Count -ne 2 -or
                @($changedWorkflowDelta | Where-Object { $_ -cnotin $allowedWorkflowDelta }).Count -ne 0) {
              throw 'W_V2_CI_SOURCE_PATH_SCOPE_DENIED'
            }
            git merge-base --is-ancestor $p.base.sha $p.head.sha
            if ($LASTEXITCODE -ne 0) { throw 'W_V2_PROTECTED_BASE_NOT_AN_ANCESTOR' }
            git merge-base --is-ancestor $wSource $p.head.sha
            if ($LASTEXITCODE -ne 0) { throw 'W_V2_QUALIFIED_SOURCE_NOT_AN_ANCESTOR' }
          }
          if ($p.head.ref -ceq 'review/xcomp-pc8-local-first-v2-source-20261111') {
            # Successor source admission only: never overrides frozen PC8.
            $prior = '54ce7208809b2fc6beba70d2713143013d6cebd3'
            $qualified = 'f48de3b02301a7de190d41fe623ccf996040d33c'
            $ciSource = '3c56da02a712ec34c74c8bad0cd2cc5c5d5ae52e'
            $historical = 'f68e4217395f58afbbb493bf7e772050d865ade8'
            $four = @(
              '.github/workflows/xcomp-pc8-local-first-source-admission.yml',
              'contracts/platform/v2/pc8_local_first_source_admission_contract_r0.json',
              'scripts/verify_pc8_local_first_source_admission_r0.py',
              'tests/contracts/test_pc8_local_first_source_admission_r0.py'
            )
            $two = @(
              '.github/workflows/xcomp-d1d2-source-integrity.yml',
              '.github/workflows/xcomp-pc0-v2-restaurant-admission.yml'
            )
            $parents = @((git rev-list --parents -n 1 $p.head.sha) -split ' ')
            if ($p.base.sha -cne '376547f7c037814ab2b19a1df8fd6c7aec08f864' -or
                $parents.Count -ne 3 -or $parents[0] -cne $p.head.sha -or
                $parents[1] -cne $p.base.sha) {
              throw 'PC8_LF_PROTECTED_TWO_PARENT_WRAPPER_DENIED'
            }
            $reviewed = $parents[2]
            git merge-base --is-ancestor $prior $reviewed
            if ($LASTEXITCODE -ne 0) { throw 'PC8_LF_QUALIFIED_SOURCE_ANCESTRY_DENIED' }
            $fourDelta = @((git diff --name-only $historical $qualified))
            if ($LASTEXITCODE -ne 0 -or $fourDelta.Count -ne 4 -or
                @($fourDelta | Where-Object { $_ -cnotin $four }).Count -ne 0) {
              throw 'PC8_LF_ORIGINAL_FOUR_PATHS_DENIED'
            }
            $ciDelta = @((git diff --name-only $qualified $ciSource))
            if ($LASTEXITCODE -ne 0 -or $ciDelta.Count -ne 2 -or
                @($ciDelta | Where-Object { $_ -cnotin $two }).Count -ne 0) {
              throw 'PC8_LF_ORIGINAL_CI_TWO_PATHS_DENIED'
            }
            $amended = @('scripts/verify_pc8_local_first_source_admission_r0.py',
                         'tests/contracts/test_pc8_local_first_source_admission_r0.py')
            $firstAmendment = @((git diff --name-only $ciSource $prior))
            if ($LASTEXITCODE -ne 0 -or $firstAmendment.Count -ne 2 -or
                @($firstAmendment | Where-Object { $_ -cnotin $amended }).Count -ne 0) {
              throw 'PC8_LF_PRIOR_TWO_AMENDMENT_PATHS_DENIED'
            }
            $finalDelta = @((git diff --name-only $prior $reviewed))
            if ($LASTEXITCODE -ne 0 -or $finalDelta.Count -ne 4 -or
                @($finalDelta | Where-Object { $_ -cnotin ($two + $amended) }).Count -ne 0) {
              throw 'PC8_LF_FINAL_FOUR_SOURCE_PATHS_DENIED'
            }
            $cumulative = @((git diff --name-only $historical $reviewed))
            if ($LASTEXITCODE -ne 0 -or $cumulative.Count -ne 6 -or
                @($cumulative | Where-Object { $_ -cnotin ($four + $two) }).Count -ne 0) {
              throw 'PC8_LF_CUMULATIVE_SOURCE_PATHS_DENIED'
            }
            foreach ($file in $four + $two) {
              $wrapperBlob = (git rev-parse ($p.head.sha + ':' + $file)).Trim()
              $reviewedBlob = (git rev-parse ($reviewed + ':' + $file)).Trim()
              if ($LASTEXITCODE -ne 0 -or $wrapperBlob -cne $reviewedBlob) {
                throw 'PC8_LF_REVIEW_WRAPPER_BLOB_DRIFT'
              }
            }
            git merge-base --is-ancestor $p.base.sha $p.head.sha
            if ($LASTEXITCODE -ne 0) { throw 'PC8_LF_PROTECTED_BASE_NOT_ANCESTOR' }
          }
          if ($p.head.ref -ceq 'review/xcomp-be-current-base-wrapper-20261111') {
            # The wrapper is a true two-parent merge: exact current protected
            # base first, immutable qualified original source second.
            $parents = @((git rev-list --parents -n 1 $p.head.sha) -split ' ')
            if ($parents.Count -ne 3 -or $parents[0] -cne $p.head.sha -or
                $parents[1] -cne $p.base.sha -or $parents[2] -cne $originalSource) {
              throw 'WRAPPER_PARENTS_NOT_PINNED'
            }
            git merge-base --is-ancestor $originalSource $p.head.sha
            if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_SOURCE_NOT_ANCESTOR' }
            git merge-base --is-ancestor $p.base.sha $p.head.sha
            if ($LASTEXITCODE -ne 0) { throw 'PROTECTED_BASE_NOT_ANCESTOR' }
          }
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-prod.txt -r requirements-test.txt
          python -m pip install --disable-pip-version-check --no-cache-dir PyJWT==2.10.1 tzdata==2025.2
      - name: Verify source integration and frozen contracts
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_HEAD_REF -cin @('ci/xcomp-d1d2-source-checks-20261109',
                                         'ci/xcomp-p3-wrapper-admission-20261111')) {
            python -m pytest -q -p no:cacheprovider --tb=short tests/contracts/test_pc0_kernel_boundaries.py tests/contracts/test_pc5_identity_policy_audit.py tests/contracts/test_pa0123_platform_administration.py tests/contracts/test_pk456_pack_conformance_templates.py
            if ($LASTEXITCODE -ne 0) { throw 'BASELINE_BOOTSTRAP_CI_FAILED' }
          } elseif ($env:GITHUB_HEAD_REF -cin @(
            'review/xcomp-pc0-v2-w-source-20261111',
            'review/xcomp-pc8-local-first-v2-source-20261111')) {
            # Historical PC0 is tested on the protected base, never falsified as
            # passing on the new W tree which historical PC0 correctly denies.
            $p = (Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json).pull_request
            $baseSha = [string]$p.base.sha
            if ($baseSha -cnotmatch '^[0-9a-f]{40}$') { throw 'W_V2_INVALID_PROTECTED_BASE' }
            $baselineDir = Join-Path $env:RUNNER_TEMP 'xcomp-w-v2-frozen-pc0-baseline'
            if (Test-Path -LiteralPath $baselineDir) { throw 'BASELINE_CHECKOUT_COLLISION' }
            git worktree add --detach $baselineDir $baseSha
            if ($LASTEXITCODE -ne 0) { throw 'BASELINE_CHECKOUT_FAILED' }
            try {
              Push-Location $baselineDir
              try {
                python -m pytest -q -p no:cacheprovider --tb=short tests/contracts/test_pc0_kernel_boundaries.py
                if ($LASTEXITCODE -ne 0) { throw 'HISTORICAL_PC0_BASELINE_FAILED' }
              } finally { Pop-Location }
            } finally {
              git worktree remove --force $baselineDir
              if ($LASTEXITCODE -ne 0) { throw 'BASELINE_WORKTREE_CLEANUP_FAILED' }
            }
            $wTests = @(
              'tests/contracts/test_pc0_local_first_restaurant_successor.py',
              'tests/integration/test_xcomp_w_disconnected_pg17_acceptance.py',
              'tests/contracts/test_pc5_identity_policy_audit.py',
              'tests/contracts/test_pa0123_platform_administration.py',
              'tests/contracts/test_pk456_pack_conformance_templates.py'
            )
            if ($env:GITHUB_HEAD_REF -ceq 'review/xcomp-pc8-local-first-v2-source-20261111') {
              $wTests += 'tests/contracts/test_pc8_local_first_source_admission_r0.py'
              # PC8 source qualification cannot become operative issuer authority.
              python scripts/verify_pc8_local_first_source_admission_r0.py --local-source
              if ($LASTEXITCODE -ne 0) { throw 'PC8_LF_NONOPERATIVE_SOURCE_PROOF_DENIED' }
            }
            python -m pytest -q -p no:cacheprovider --tb=short $wTests
            if ($LASTEXITCODE -ne 0) { throw 'W_V2_SOURCE_AND_SECURITY_REGRESSION_FAILED' }
          } else {
            # Generic required PR check separately tests the GitHub merge SHA.
            # The additive PC8 bridge requires the actual immutable source branch.
            $p = (Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json).pull_request
            git switch -c platform/xcomp-d1d2-integrated-source-20261109 $p.head.sha
            if ($LASTEXITCODE -ne 0 -or (git rev-parse HEAD).Trim() -cne $p.head.sha) {
              throw 'CANNOT_BIND_ADMITTED_SOURCE_HEAD'
            }
            $s = @(
              'test_xcomp_d1d2_source_integration_readiness_r0.py',
              'test_xcomp_n_d1d2_neutral_http_source_r0.py',
              'test_xcomp_n_d1d2_pc8_merged_bridge_r0.py',
              'test_xcomp_pa_d2_blueprint_candidate.py',
              'test_xcomp_pk_d2_activation_plan_preview.py',
              'test_xcomp_sof_d3_source_preflight.py',
              'test_wnd_d2_nonoperative_area_and_parity.py',
              'test_pc0_kernel_boundaries.py',
              'test_pc1_structural_authority.py',
              'test_pc4_operating_context.py',
              'test_pc5_identity_policy_audit.py',
              'test_pa0123_platform_administration.py',
              'test_pk0123_pack_manifest_lifecycle_extensions.py',
              'test_pk456_pack_conformance_templates.py',
              'test_r1_restaurant_service_operation.py',
              'test_so3_inventory_stock_movement.py',
              'test_m43_transactional_payment_settlements.py',
              'test_m50_receivables_and_customer_balances.py',
              'test_m53_tips_and_commissions.py',
              'test_m63_formal_close_reopen_and_closed_period_governance.py'
            ) | ForEach-Object { "tests/contracts/$_" }
            python -m pytest -q -p no:cacheprovider --tb=short $s
            if ($LASTEXITCODE -ne 0) { throw 'D1D2_INTEGRATION_REGRESSION_FAILED' }
          }
