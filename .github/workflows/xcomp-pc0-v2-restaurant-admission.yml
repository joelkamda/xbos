# PCR V21 LOCAL CANDIDATE - NOT PUBLISHED OR INSTALLED
# Source integrity only. Historical PC0/PC8 release controls remain independent.
name: xcomp-pc0-v2-restaurant-source-admission
on:
  pull_request:
    branches:
      - platform/neutral-vnext-vn2-pc0-discovery-successor
permissions:
  contents: read
jobs:
  pc0-v2-restaurant-admission:
    name: xcomp-pc0-v2-restaurant-admission
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact reviewed PR merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify PR event ancestry and W-v2 immutable source blobs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:GITHUB_EVENT_NAME -cne 'pull_request' -or
              $env:GITHUB_REPOSITORY -cne 'joelkamda/xbos') { throw 'NOT_GENUINE_W_V2_PR' }
          if (-not (Test-Path -LiteralPath $env:GITHUB_EVENT_PATH)) { throw 'MISSING_GITHUB_PR_EVENT' }
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $pr = $event.pull_request
          $source = 'd5ffbc3c253cbd0530bd15cac1e594a0447bf8e5'
          $branch = 'review/xcomp-pc0-v2-w-source-20261111'
          $admittedExisting = @(
            'ci/xcomp-d1d2-source-checks-20261109',
            'ci/xcomp-p3-wrapper-admission-20261111',
            'platform/xcomp-d1d2-integrated-source-20261109',
            'review/xcomp-be-current-base-wrapper-20261111'
          )
          $baseBranch = 'platform/neutral-vnext-vn2-pc0-discovery-successor'
          if ($null -eq $pr -or $event.repository.full_name -cne $env:GITHUB_REPOSITORY -or
              $event.number -le 0 -or $event.number -ne $pr.number -or
              $pr.head.repo.full_name -cne $env:GITHUB_REPOSITORY -or
              $pr.base.repo.full_name -cne $env:GITHUB_REPOSITORY -or
              $pr.head.ref -cne $env:GITHUB_HEAD_REF -or
              ($pr.head.ref -cne $branch -and $pr.head.ref -cnotin $admittedExisting) -or
              $pr.base.ref -cne $baseBranch -or $env:GITHUB_BASE_REF -cne $baseBranch -or
              $env:GITHUB_REF -cne "refs/pull/$($event.number)/merge") {
            throw 'W_V2_EVENT_BRANCH_DENIED'
          }
          $head = [string]$pr.head.sha
          $base = [string]$pr.base.sha
          if ($head -cnotmatch '^[0-9a-f]{40}$' -or $base -cnotmatch '^[0-9a-f]{40}$') {
            throw 'INVALID_W_V2_SHA'
          }
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'PR_MERGE_HEAD_DRIFT' }
          if ($pr.head.ref -ceq $branch) {
            $parents = @((git rev-list --parents -n 1 $head) -split ' ')
            if ($parents.Count -ne 3 -or $parents[0] -cne $head -or
              $parents[1] -cne $base -or $parents[2] -cne $source) {
            throw 'W_V2_TWO_PARENT_WRAPPER_DENIED'
          }
          git merge-base --is-ancestor $head HEAD
          if ($LASTEXITCODE -ne 0) { throw 'W_V2_HEAD_NOT_IN_PR_MERGE' }
          git merge-base --is-ancestor $base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'W_V2_BASE_NOT_IN_PR_MERGE' }
          git merge-base --is-ancestor $source $head
          if ($LASTEXITCODE -ne 0) { throw 'W_V2_SOURCE_NOT_AN_ANCESTOR' }
          $files = @(
            'contracts/platform/v2/pc0_local_first_restaurant_successor.json',
            'core/platform/local_first_restaurant_architecture_successor.py',
            'tests/contracts/test_pc0_local_first_restaurant_successor.py',
            'core/api/restaurant/local_first_lan_router.py',
            'core/domain/restaurant/local_first_shift_session.py',
            'core/domain/restaurant/local_first_stock_draft.py',
            'core/domain/restaurant/local_first_receipt_service.py',
            'tests/integration/test_xcomp_w_disconnected_pg17_acceptance.py'
          )
          foreach ($file in $files) {
            $expected = (git rev-parse ($source + ':' + $file)).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'QUALIFIED_W_V2_BLOB_NOT_FOUND' }
            $wrapper = (git rev-parse ($head + ':' + $file)).Trim()
            if ($LASTEXITCODE -ne 0 -or $wrapper -cne $expected) {
              throw 'W_V2_WRAPPER_SOURCE_BLOB_CHANGED'
            }
            $merged = (git rev-parse ('HEAD:' + $file)).Trim()
            if ($LASTEXITCODE -ne 0 -or $merged -cne $expected) {
              throw 'W_V2_PR_MERGE_SOURCE_BLOB_CHANGED'
            }
          }
          } else {
            # A globally required check must actually validate historic PRs,
            # rather than skip or deny every non-W source branch.
            git merge-base --is-ancestor $head HEAD
            if ($LASTEXITCODE -ne 0) { throw 'HISTORICAL_PR_HEAD_NOT_MERGE_ANCESTOR' }
            git merge-base --is-ancestor $base HEAD
            if ($LASTEXITCODE -ne 0) { throw 'HISTORICAL_PR_BASE_NOT_MERGE_ANCESTOR' }
          }
      - name: Install pinned test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-prod.txt -r requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw 'W_V2_DEPENDENCIES_FAILED' }
          python -m pip install --disable-pip-version-check --no-cache-dir PyJWT==2.10.1 tzdata==2025.2
          if ($LASTEXITCODE -ne 0) { throw 'W_V2_TEST_PINNED_DEPS_FAILED' }
      - name: Historical PC0 independently checked on protected source
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $base = [string]$event.pull_request.base.sha
          if ($base -cnotmatch '^[0-9a-f]{40}$') { throw 'W_V2_UNTRUSTED_BASE' }
          $dir = Join-Path $env:RUNNER_TEMP 'xcomp-w-pc0-baseline'
          if (Test-Path -LiteralPath $dir) { throw 'PC0_BASELINE_PATH_COLLISION' }
          if ($env:GITHUB_HEAD_REF -cne 'review/xcomp-pc0-v2-w-source-20261111') {
            # Unmodified historical source PR: run PC0 on the actual PR merge.
            python -m pytest -q -p no:cacheprovider --tb=short tests/contracts/test_pc0_kernel_boundaries.py
            if ($LASTEXITCODE -ne 0) { throw 'HISTORICAL_PC0_EXISTING_PR_FAILED' }
          } else {
            git worktree add --detach $dir $base
            if ($LASTEXITCODE -ne 0) { throw 'PC0_BASELINE_CHECKOUT_FAILED' }
            try {
            Push-Location $dir
            try {
              python -m pytest -q -p no:cacheprovider --tb=short tests/contracts/test_pc0_kernel_boundaries.py
              if ($LASTEXITCODE -ne 0) { throw 'HISTORICAL_PC0_FAILURE' }
            } finally { Pop-Location }
          } finally {
            git worktree remove --force $dir
            if ($LASTEXITCODE -ne 0) { throw 'PC0_CHECKOUT_CLEANUP_FAILED' }
            }
          }
      - name: W v2 prospective source and tenant security tests
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_HEAD_REF -ceq 'review/xcomp-pc0-v2-w-source-20261111') {
            $tests = @(
              'tests/contracts/test_pc0_local_first_restaurant_successor.py',
              'tests/integration/test_xcomp_w_disconnected_pg17_acceptance.py',
              'tests/contracts/test_pc5_identity_policy_audit.py',
              'tests/contracts/test_pa0123_platform_administration.py',
              'tests/contracts/test_pk456_pack_conformance_templates.py'
            )
          } else {
            # Non-W source PRs must still run real security tests, never a
            # deliberately skipped or unconditional-success required job.
            $tests = @(
              'tests/contracts/test_pc5_identity_policy_audit.py',
              'tests/contracts/test_pa0123_platform_administration.py',
              'tests/contracts/test_pk456_pack_conformance_templates.py'
            )
          }
          python -m pytest -q -p no:cacheprovider --tb=short $tests
          if ($LASTEXITCODE -ne 0) { throw 'W_V2_SECURITY_REGRESSION_FAILED' }
