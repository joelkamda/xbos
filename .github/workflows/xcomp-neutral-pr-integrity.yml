# PCR DESIGN CANDIDATE ONLY - NOT INSTALLED IN REPOSITORY.
# No GitHub rule, merge, key, release or deployment action is authorized here.
# General neutral-branch PR source integrity check; not Route A exact-branch admission.
name: xcomp-neutral-source-pr-gate

on:
  pull_request:
    branches:
      - platform/neutral-vnext-vn2-pc0-discovery-successor

permissions:
  contents: read

jobs:
  neutral-pr-source-integrity:
    name: xcomp-neutral-pr-integrity
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Exact GitHub pull request merge checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify neutral PR provenance and merge ancestry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:GITHUB_EVENT_NAME -ne 'pull_request') {
            throw 'NOT_A_REAL_GITHUB_PULL_REQUEST_RUN'
          }
          if ($env:GITHUB_REPOSITORY -cne 'joelkamda/xbos') {
            throw 'WRONG_REPOSITORY'
          }
          if (-not (Test-Path -LiteralPath $env:GITHUB_EVENT_PATH)) {
            throw 'MISSING_SIGNED_EVENT_CONTEXT'
          }
          $e = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $pr = $e.pull_request
          $expectedBase = 'platform/neutral-vnext-vn2-pc0-discovery-successor'
          if ($null -eq $pr -or $e.repository.full_name -cne $env:GITHUB_REPOSITORY) {
            throw 'MALFORMED_PR_EVENT'
          }
          if ($e.number -le 0 -or $pr.number -ne $e.number) {
            throw 'WRONG_PR_NUMBER'
          }
          if ($pr.head.repo.full_name -cne $env:GITHUB_REPOSITORY -or $pr.base.repo.full_name -cne $env:GITHUB_REPOSITORY) {
            throw 'UNTRUSTED_CROSS_REPOSITORY_PR'
          }
          if ($pr.base.ref -cne $expectedBase -or $env:GITHUB_BASE_REF -cne $expectedBase) {
            throw 'WRONG_NEUTRAL_BASE_BRANCH'
          }
          if ($pr.head.ref -cne $env:GITHUB_HEAD_REF -or $env:GITHUB_REF -cne "refs/pull/$($e.number)/merge") {
            throw 'GITHUB_PR_EVENT_REF_MISMATCH'
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA) {
            throw 'WRONG_MERGE_CHECKOUT_SHA'
          }
          $headSha = [string]$pr.head.sha
          $baseSha = [string]$pr.base.sha
          if ($headSha -cnotmatch '^[0-9a-f]{40}$' -or $baseSha -cnotmatch '^[0-9a-f]{40}$') {
            throw 'INVALID_PR_HEAD_OR_BASE_SHA'
          }
          git merge-base --is-ancestor $headSha HEAD
          if ($LASTEXITCODE -ne 0) { throw 'PR_HEAD_NOT_A_MERGE_ANCESTOR' }
          git merge-base --is-ancestor $baseSha HEAD
          if ($LASTEXITCODE -ne 0) { throw 'PR_BASE_NOT_A_MERGE_ANCESTOR' }
      - name: Install pinned production and test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-prod.txt -r requirements-test.txt
      - name: Neutral source lineage, tenant isolation, onboarding, packs, finance
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONUTF8: '1'
        run: |
          python -m pytest -q -p no:cacheprovider --tb=short tests/contracts/test_historical_frozen_lineage_descendants.py tests/contracts/test_ia0_neutral_interaction_contract_foundation.py tests/contracts/test_m13_neutral_financial_foundation.py tests/contracts/test_m27_m2_acceptance.py tests/contracts/test_pc5_identity_policy_audit.py tests/contracts/test_pa0123_platform_administration.py tests/contracts/test_pk0123_pack_manifest_lifecycle_extensions.py tests/contracts/test_pk456_pack_conformance_templates.py tests/contracts/test_m81_ordering_offline_isolation_and_authorization.py
