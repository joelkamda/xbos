# CEO-authorized G4-A: review-only source transfer of accepted R7 detached TEST.
# Does not alter required neutral-branch CI, grant PC5, merge or deploy.
name: xcomp-g4a-r7-source-admission
on:
  pull_request:
    branches:
      - platform/neutral-vnext-vn2-pc0-discovery-successor
    paths:
      - "g4a_testonly/**"
      - "restaurant/g4a_source_admission.py"
      - "tests/contracts/test_g4a_r7_canonical_source_admission.py"
      - ".github/workflows/xcomp-g4a-r7-source-admission.yml"
permissions:
  contents: read
jobs:
  source-admission:
    name: xcomp-g4a-r7-source-admission
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GitHub merge candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Pin Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify exact PR origin and no release authorization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -cne 'pull_request' -or $env:GITHUB_REPOSITORY -cne 'joelkamda/xbos' -or
              $env:GITHUB_REF -cnotmatch '^refs/pull/[0-9]+/merge$') { throw 'G4A_NOT_AUTHENTIC_PR' }
          $e = Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          if ($e.pull_request.base.ref -cne 'platform/neutral-vnext-vn2-pc0-discovery-successor' -or
              $e.pull_request.head.repo.full_name -cne 'joelkamda/xbos') { throw 'G4A_WRONG_SOURCE_OR_TARGET' }
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'G4A_CHECKOUT_REF_DRIFT' }
          git merge-base --is-ancestor $e.pull_request.base.sha HEAD
          if ($LASTEXITCODE -ne 0) { throw 'G4A_PROTECTED_BASE_NOT_ANCESTOR' }
          git merge-base --is-ancestor $e.pull_request.head.sha HEAD
          if ($LASTEXITCODE -ne 0) { throw 'G4A_PROPOSAL_NOT_MERGE_ANCESTOR' }
          if (Select-String -Path startup.py,main.py -Pattern 'g4a_testonly','g4a_source_admission') {
              throw 'G4A_SYNTHETIC_SOURCE_OPERATIVE_IMPORT_DENIED'
          }
      - name: Install source-only test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-test.txt tzdata==2025.2 psycopg2-binary==2.9.10
      - name: Verify source SHA, fail-closed runtime boundary and WND shift contract
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONUTF8: "1"
        run: |
          python -m pytest -q -p no:cacheprovider --tb=short tests/contracts/test_g4a_r7_canonical_source_admission.py tests/contracts/test_g4a_canonical_product_publication.py tests/contracts/test_g4a_pg_candidate_boundary.py
          if ($LASTEXITCODE -ne 0) { throw 'G4A_SOURCE_OR_CANONICAL_PRODUCT_ADMISSION_FAILED' }
          python -m py_compile restaurant/g4a_canonical_product_publication.py restaurant/g4a_canonical_product_pg_repository.py
          if ($LASTEXITCODE -ne 0) { throw 'G4A_CANONICAL_POSTGRES_REPO_COMPILE_FAILED' }
      - name: Build TEST-only R7 merchant React preview (not deployed)
        shell: pwsh
        working-directory: g4a_testonly/source/frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'G4A_UI_DEPS_FAILED' }
          npx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { throw 'G4A_UI_TYPESCRIPT_FAILED' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'G4A_UI_BUILD_FAILED' }
