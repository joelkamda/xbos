# LOCAL UNPUSHED DRAFT ? N Nov08 PCR SOURCE-ONLY authorization.
# NOT ACTIVE, NOT A REQUIRED STATUS, NOT A TRUSTED RELEASE.
# Source-integrity acceptance is DISTINCT from operative release approval.
# Required job xcomp-pc8-registered-current-source intentionally DENIES
# until independent release issuer, protected branch required status and
# same SHA deployment enforcement are separately qualified and commissioned.
name: xcomp-pc8-current-source-gate-draft

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcomp-pc8-current-source-integrity:
    name: ${{ github.event_name == 'pull_request' && 'xcomp-pc8-pr-source-integrity' || 'xcomp-pc8-nonpr-source-denial' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Exact GitHub event checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Pinned isolated test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.4.2" "pluggy==1.6.0" "iniconfig==2.1.0" "packaging==25.0" "pygments==2.19.2" "colorama==0.4.6"
      - name: Committed source SHA and immutable PC8 candidate check
        shell: cmd
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONUTF8: '1'
        run: XBOS_PC8_CURRENT_SOURCE_RUN_ACCEPTANCE.cmd --committed-preflight

  # This exact separate release job MUST NOT be replaced with the positive
  # source-integrity job as a required release status. No 'if' or 'needs'
  # could allow a "skipped" release job to be mistaken for a true denial.
  xcomp-pc8-registered-current-source:
    name: xcomp-pc8-registered-current-source
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Exact GitHub event checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Independent operative release admission (expected DENIED)
        shell: cmd
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: XBOS_PC8_CURRENT_SOURCE_RUN_ACCEPTANCE.cmd --operative

# Provenance review:
# actions/checkout v4.2.2 official GitHub SHA:
# https://github.com/actions/checkout/commit/11bd71901bbe5b1630ceea73d27597364c9af683
# actions/setup-python v5.6.0 official GitHub SHA:
# https://github.com/actions/setup-python/commit/a26af69be951a213d495a4c3e4e4022e16d87065
#
# PR workflow only proposal; GitHub branches are still UNPROTECTED.
# Current committed preflight is event-bound SOURCE-only (not release trust).
# No permissions to write repository; no secret, no workflow activation.
# Independent owner/controller signatures, revocation and branch rules
# remain held; postcommit source cannot become operative from JSON booleans.
