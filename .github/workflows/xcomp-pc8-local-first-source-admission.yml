# Local-only PROSPECTIVE source-gate candidate. NOT a registered operative release.
# Does not replace or disable historical PC8 workflows or branch rules.
name: xcomp-pc8-local-first-source-admission
on:
  pull_request:
    branches:
      - platform/neutral-vnext-vn2-pc0-discovery-successor
permissions:
  contents: read
jobs:
  pc8-local-first-source-admission:
    name: xcomp-pc8-local-first-source-admission
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR merge source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install test-only dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-prod.txt -r requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw 'PC8_LF_SOURCE_TEST_DEPENDENCIES_FAILED' }
          python -m pip install --disable-pip-version-check --no-cache-dir PyJWT==2.10.1 tzdata==2025.2
          if ($LASTEXITCODE -ne 0) { throw 'PC8_LF_TEST_PINNED_DEPS_FAILED' }
      - name: Genuine GitHub PR source, ancestry, hashes, and nonoperative declaration
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/verify_pc8_local_first_source_admission_r0.py --github-pr-source
          if ($LASTEXITCODE -ne 0) { throw 'PC8_LF_GITHUB_SOURCE_ADMISSION_DENIED' }
      - name: Synthetic successor and inherited W/PC5/PK denial tests
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'tests/contracts/test_pc8_local_first_source_admission_r0.py',
            'tests/contracts/test_pc0_local_first_restaurant_successor.py',
            'tests/integration/test_xcomp_w_disconnected_pg17_acceptance.py',
            'tests/contracts/test_pc5_identity_policy_audit.py',
            'tests/contracts/test_pk456_pack_conformance_templates.py'
          )
          python -m pytest -q -p no:cacheprovider --tb=short $tests
          if ($LASTEXITCODE -ne 0) { throw 'PC8_LF_SOURCE_SECURITY_TESTS_DENIED' }
